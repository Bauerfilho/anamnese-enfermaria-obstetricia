<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b5e" />
  <meta name="description" content="Calculadora de anamnese de enfermaria obstétrica — preencha o questionário e o documento é gerado no formato da preceptora." />
  <title>Anamnese Enfermaria — Obstetrícia</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- fundo decorativo: dot-grid + orbs -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="orb orb-a" aria-hidden="true"></div>
  <div class="orb orb-b" aria-hidden="true"></div>

  <header class="topo" id="topo">
    <div class="topo-inner">
      <div class="brand">
        <span class="brand-ponto" aria-hidden="true"></span>
        <div class="brand-txt">
          <strong>Anamnese Enfermaria</strong>
          <span>Obstetrícia · GO</span>
        </div>
      </div>

      <div class="topo-acoes">
        <button id="btn-tema" class="btn-icone" title="Alternar tema" aria-label="Alternar tema">◐</button>
        <button id="btn-menu" class="btn-icone btn-hamb" title="Seções" aria-label="Abrir menu de seções" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- menu lateral de seções -->
  <nav id="nav" class="nav-lateral" aria-label="Seções do documento"></nav>
  <div id="nav-overlay" class="nav-overlay" hidden></div>

  <!-- ============ TELA DE LOGIN (porta de entrada) ============ -->
  <section id="login-screen" class="login-screen" aria-label="Acesso">
    <div class="login-card" id="login-card">
      <span class="login-marca-texto">invertexto</span>
      <div class="login-nome-wrap">
        <span class="login-estrela" aria-hidden="true">✦</span>
        <h1 class="login-nome">Isana</h1>
      </div>
      <img class="login-icone" src="assets/marca-isana.svg" alt="" width="120" height="120" />
      <p class="login-sub">Anamnese de Enfermaria · Obstetrícia</p>

      <form id="login-form" class="login-form" novalidate>
        <label class="login-label" for="login-user">Login</label>
        <input id="login-user" class="campo-input" type="text" autocomplete="username"
               placeholder="Dra. Isana" />
        <label class="login-label" for="login-pass">Senha</label>
        <input id="login-pass" class="campo-input" type="password" autocomplete="current-password"
               placeholder="••••••••••••" />
        <p id="login-erro" class="login-erro" role="alert" hidden>Login ou senha incorretos.</p>
        <button type="submit" class="btn btn-pri login-btn">Entrar</button>
      </form>
    </div>
  </section>

  <main class="layout" id="app" hidden>
    <!-- formulário -->
    <section class="coluna coluna-form" aria-label="Questionário">
      <div id="form-root"></div>
    </section>

    <!-- saída -->
    <section class="coluna coluna-out" aria-label="Documento gerado">
      <div class="out-card">
        <div class="out-head">
          <div class="out-titulo">
            <strong>Documento</strong>
            <span id="contador" class="contador">0 caracteres</span>
          </div>
          <div class="out-acoes">
            <button id="btn-limpar" class="btn btn-sec">Limpar</button>
            <button id="btn-copiar" class="btn btn-pri">Copiar</button>
          </div>
        </div>
        <pre id="output" class="output" tabindex="0"></pre>
      </div>
    </section>
  </main>

  <script src="js/templates.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/app.js"></script>
  <script>
    /* toggle do menu lateral (mobile) */
    (function () {
      var btn = document.getElementById('btn-menu');
      var nav = document.getElementById('nav');
      var ov = document.getElementById('nav-overlay');
      function toggle(force) {
        var open = typeof force === 'boolean' ? force : !nav.classList.contains('aberto');
        nav.classList.toggle('aberto', open);
        btn.setAttribute('aria-expanded', String(open));
        ov.hidden = !open;
      }
      btn.addEventListener('click', function () { toggle(); });
      ov.addEventListener('click', function () { toggle(false); });
      nav.addEventListener('click', function (e) {
        if (e.target.classList.contains('nav-item')) toggle(false);
      });

      /* header que some ao rolar e volta */
      var lastY = 0, topo = document.getElementById('topo');
      window.addEventListener('scroll', function () {
        var y = window.scrollY;
        topo.classList.toggle('escondido', y > lastY && y > 80);
        lastY = y;
      }, { passive: true });
    })();
  </script>
</body>
</html>
